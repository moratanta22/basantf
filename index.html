<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار علم النفس - 50 سؤال</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d1a;
  --card:#13132b;
  --card2:#1a1a3a;
  --accent:#9b59b6;
  --accent2:#8e44ad;
  --silver:#c0c0d0;
  --silver2:#a0a0c0;
  --gold:#d4af37;
  --correct:#00c49a;
  --wrong:#e74c3c;
  --glow:rgba(155,89,182,0.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  background-image:radial-gradient(ellipse at 20% 20%,rgba(155,89,182,0.08) 0%,transparent 60%),
                   radial-gradient(ellipse at 80% 80%,rgba(192,192,208,0.05) 0%,transparent 60%)}

/* ===== WELCOME SCREEN ===== */
#welcome-screen{
  position:fixed;inset:0;z-index:999;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(ellipse at 30% 30%,rgba(155,89,182,0.12) 0%,transparent 60%);
}
.welcome-box{
  background:var(--card);
  border:1px solid rgba(155,89,182,0.4);
  border-radius:24px;
  padding:50px 40px;
  max-width:420px;width:90%;
  text-align:center;
  box-shadow:0 0 60px rgba(155,89,182,0.2);
  animation:fadeUp 0.5s ease;
}
.welcome-logo{font-size:3rem;margin-bottom:12px}
.welcome-title{font-size:1.6rem;font-weight:900;color:#fff;margin-bottom:6px}
.welcome-title span{color:var(--accent)}
.welcome-sub{color:var(--silver2);font-size:0.9rem;margin-bottom:32px}
.welcome-label{display:block;text-align:right;font-size:0.88rem;color:var(--silver);margin-bottom:8px;font-weight:600}
.welcome-input{
  width:100%;padding:14px 18px;border-radius:12px;
  border:2px solid rgba(155,89,182,0.3);
  background:rgba(155,89,182,0.08);
  color:#fff;font-family:'Cairo',sans-serif;font-size:1rem;font-weight:600;
  outline:none;transition:border 0.2s;text-align:right;margin-bottom:24px;
}
.welcome-input:focus{border-color:var(--accent)}
.welcome-input::placeholder{color:#555}
.start-btn{
  width:100%;padding:15px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--accent),#6c3483);
  color:#fff;font-family:'Cairo',sans-serif;font-size:1.05rem;font-weight:700;
  cursor:pointer;transition:all 0.2s;
  box-shadow:0 4px 20px rgba(155,89,182,0.4);
}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(155,89,182,0.5)}
.welcome-err{color:var(--wrong);font-size:0.85rem;margin-top:-16px;margin-bottom:16px;display:none}

/* ===== HEADER ===== */
header{
  width:100%;
  background:linear-gradient(135deg,#100f2a,#1a1a3a);
  padding:24px 20px 18px;text-align:center;
  border-bottom:2px solid rgba(155,89,182,0.5);
  position:relative;overflow:hidden;
}
header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--silver),transparent);
}
.header-top{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.owner-img{
  width:52px;height:52px;border-radius:50%;
  border:2px solid var(--accent);
  object-fit:cover;
  box-shadow:0 0 16px rgba(155,89,182,0.5);
  /* إذا مفيش صورة بتظهر الـ placeholder */
}
.owner-img-placeholder{
  width:52px;height:52px;border-radius:50%;
  border:2px solid var(--accent);
  background:linear-gradient(135deg,var(--accent),#6c3483);
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;flex-shrink:0;
  box-shadow:0 0 16px rgba(155,89,182,0.5);
}
.header-name{font-size:1.8rem;font-weight:900;color:#fff}
.header-name span{
  background:linear-gradient(135deg,var(--accent),var(--silver));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.header-badge{
  font-size:0.75rem;font-weight:700;color:var(--accent);
  background:rgba(155,89,182,0.15);border:1px solid rgba(155,89,182,0.4);
  border-radius:20px;padding:3px 12px;letter-spacing:1px;
}
.header-sub{font-size:0.85rem;color:var(--silver2);margin-top:8px}
.header-sub span{color:var(--gold);font-weight:700}
.user-greeting{
  font-size:0.85rem;color:var(--silver2);margin-top:4px;
}
.user-greeting span{color:var(--accent);font-weight:700}

/* ===== CONTAINER ===== */
.container{width:100%;max-width:750px;padding:28px 16px 50px}

/* ===== PROGRESS ===== */
.progress-wrap{margin-bottom:22px}
.progress-info{display:flex;justify-content:space-between;font-size:0.88rem;color:var(--silver2);margin-bottom:8px}
.progress-bar{width:100%;height:8px;background:#1a1a3a;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--silver));border-radius:99px;transition:width 0.4s ease}

/* ===== QUESTION CARD ===== */
.question-card{
  background:var(--card);border-radius:20px;padding:30px 26px 24px;
  border:1px solid rgba(155,89,182,0.2);
  box-shadow:0 8px 40px rgba(0,0,0,0.5),0 0 0 1px rgba(192,192,208,0.05);
  animation:fadeUp 0.35s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.q-number{font-size:0.82rem;color:var(--accent);font-weight:700;margin-bottom:10px;letter-spacing:1px}
.q-type-badge{
  display:inline-block;font-size:0.72rem;padding:2px 10px;border-radius:99px;margin-bottom:14px;font-weight:700;
}
.badge-mcq{background:rgba(212,175,55,0.12);border:1px solid var(--gold);color:var(--gold)}
.badge-tf{background:rgba(155,89,182,0.12);border:1px solid var(--accent);color:var(--accent)}
.q-text{font-size:1.12rem;font-weight:600;line-height:1.75;color:#e8eaf0;margin-bottom:24px}

/* MCQ answers */
.answers{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.ans-btn{
  width:100%;padding:13px 18px;border-radius:12px;
  border:1.5px solid rgba(155,89,182,0.2);
  background:rgba(155,89,182,0.06);
  color:#ccc;font-family:'Cairo',sans-serif;font-size:0.98rem;font-weight:600;
  cursor:pointer;transition:all 0.2s;text-align:right;
}
.ans-btn:hover:not(:disabled){border-color:var(--silver);color:#fff;background:rgba(192,192,208,0.1);transform:translateX(-3px)}
.ans-btn.selected-correct{background:rgba(0,196,154,0.15);border-color:var(--correct);color:var(--correct)}
.ans-btn.selected-wrong{background:rgba(231,76,60,0.15);border-color:var(--wrong);color:var(--wrong)}
.ans-btn.reveal-correct{background:rgba(0,196,154,0.08);border-color:rgba(0,196,154,0.5);color:rgba(0,196,154,0.8)}
.ans-btn:disabled{cursor:default}

/* TF answers */
.tf-answers{display:flex;gap:14px;margin-bottom:20px}
.tf-btn{
  flex:1;padding:16px;border-radius:12px;
  border:1.5px solid rgba(155,89,182,0.2);
  background:rgba(155,89,182,0.06);
  color:#ccc;font-family:'Cairo',sans-serif;font-size:1.05rem;font-weight:700;
  cursor:pointer;transition:all 0.2s;text-align:center;
}
.tf-btn:hover:not(:disabled){border-color:var(--silver);color:#fff;background:rgba(192,192,208,0.1);transform:translateY(-2px)}
.tf-btn.selected-correct{background:rgba(0,196,154,0.15);border-color:var(--correct);color:var(--correct)}
.tf-btn.selected-wrong{background:rgba(231,76,60,0.15);border-color:var(--wrong);color:var(--wrong)}
.tf-btn.reveal-correct{background:rgba(0,196,154,0.08);border-color:rgba(0,196,154,0.5);color:rgba(0,196,154,0.8)}
.tf-btn:disabled{cursor:default}

.feedback{font-size:0.95rem;font-weight:700;min-height:22px;margin-bottom:16px;text-align:center}
.feedback.correct{color:var(--correct)}
.feedback.wrong{color:var(--wrong)}

/* Nav */
.nav-buttons{display:flex;gap:10px}
.nav-btn{padding:11px 24px;border-radius:10px;border:none;font-family:'Cairo',sans-serif;font-size:0.93rem;font-weight:700;cursor:pointer;transition:all 0.2s}
.nav-btn.prev{background:#1a1a3a;color:var(--silver2);border:1px solid rgba(155,89,182,0.2)}
.nav-btn.prev:hover{background:#22224a;color:#fff}
.nav-btn.next{background:linear-gradient(135deg,var(--accent),#6c3483);color:#fff;flex:1;box-shadow:0 4px 16px rgba(155,89,182,0.3)}
.nav-btn.next:hover{box-shadow:0 6px 22px rgba(155,89,182,0.5);transform:translateY(-1px)}
.nav-btn.finish{background:linear-gradient(135deg,var(--gold),#b8860b);color:#000;flex:1;font-weight:900}
.nav-btn.finish:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(212,175,55,0.4)}

/* Dots */
.dots-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;justify-content:center}
.dot{
  width:28px;height:28px;border-radius:50%;background:#13132b;
  border:1.5px solid rgba(155,89,182,0.25);cursor:pointer;
  font-size:0.65rem;font-weight:700;color:#666;
  display:flex;align-items:center;justify-content:center;transition:all 0.15s;
}
.dot:hover{border-color:var(--silver);color:var(--silver)}
.dot.answered-correct{background:rgba(0,196,154,0.2);border-color:var(--correct);color:var(--correct)}
.dot.answered-wrong{background:rgba(231,76,60,0.2);border-color:var(--wrong);color:var(--wrong)}
.dot.current{border-color:var(--accent);color:var(--accent);transform:scale(1.2);box-shadow:0 0 10px rgba(155,89,182,0.4)}

/* ===== RESULTS ===== */
.results{
  background:var(--card);border-radius:20px;padding:40px 26px;text-align:center;
  border:1px solid rgba(155,89,182,0.2);
  box-shadow:0 8px 40px rgba(0,0,0,0.5);animation:fadeUp 0.4s ease;
}
.result-title{font-size:1.5rem;font-weight:900;color:var(--silver);margin-bottom:6px}
.result-score{font-size:4rem;font-weight:900;margin:14px 0}
.result-score span{
  background:linear-gradient(135deg,var(--accent),var(--silver));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.result-grade{font-size:1.15rem;font-weight:700;margin-bottom:22px;color:var(--silver2)}
.result-breakdown{display:flex;gap:14px;justify-content:center;margin-bottom:24px}
.rb{flex:1;max-width:140px;padding:14px;border-radius:12px;font-weight:700}
.rb.c{background:rgba(0,196,154,0.1);border:1px solid var(--correct);color:var(--correct)}
.rb.w{background:rgba(231,76,60,0.1);border:1px solid var(--wrong);color:var(--wrong)}
.rb-num{font-size:2rem;font-weight:900}
.rb-lbl{font-size:0.82rem}

/* FRAME for 45+ */
.winner-frame{
  margin:0 auto 28px;
  padding:24px 20px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(212,175,55,0.1),rgba(155,89,182,0.1));
  border:2px solid var(--gold);
  box-shadow:0 0 30px rgba(212,175,55,0.25),inset 0 0 30px rgba(212,175,55,0.05);
  position:relative;overflow:hidden;
  animation:pulse-frame 2s ease infinite;
}
@keyframes pulse-frame{0%,100%{box-shadow:0 0 30px rgba(212,175,55,0.25)}50%{box-shadow:0 0 50px rgba(212,175,55,0.5)}}
.winner-frame::before,.winner-frame::after{
  content:'✦';position:absolute;font-size:1.5rem;color:var(--gold);opacity:0.5;
}
.winner-frame::before{top:10px;right:14px}
.winner-frame::after{bottom:10px;left:14px}
.winner-crown{font-size:2.5rem;margin-bottom:8px}
.winner-name{font-size:1.8rem;font-weight:900;color:var(--gold);margin-bottom:4px}
.winner-msg{font-size:0.9rem;color:var(--silver2)}
.confetti-row{font-size:1.4rem;margin-bottom:8px;letter-spacing:4px}

.wrong-list{text-align:right;margin-top:16px}
.wrong-item{
  background:rgba(231,76,60,0.06);border:1px solid rgba(231,76,60,0.2);
  border-radius:10px;padding:12px 16px;margin-bottom:10px;font-size:0.9rem;line-height:1.6;
}
.wrong-item .q-num-lbl{color:var(--gold);font-weight:700;font-size:0.8rem}
.wrong-item .q-txt{color:#ddd;margin:4px 0}
.wrong-item .correct-ans{color:var(--correct);font-weight:600;font-size:0.86rem}
.wrong-item .your-ans{color:var(--wrong);font-size:0.86rem}
.wrong-title{font-size:1rem;font-weight:700;color:#ddd;margin-bottom:14px;border-bottom:1px solid #1a1a3a;padding-bottom:10px}

.retry-btn{
  background:linear-gradient(135deg,var(--accent),#6c3483);
  color:#fff;border:none;padding:13px 36px;border-radius:10px;
  font-family:'Cairo',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;
  transition:all 0.2s;margin-top:10px;
  box-shadow:0 4px 18px rgba(155,89,182,0.35);
}
.retry-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(155,89,182,0.5)}

@media(max-width:500px){
  .header-name{font-size:1.35rem}
  .q-text{font-size:1rem}
  .dot{width:22px;height:22px;font-size:0.58rem}
  .result-score{font-size:3rem}
  .welcome-box{padding:36px 24px}
}
</style>
</head>
<body>

<!-- WELCOME SCREEN -->
<div id="welcome-screen">
  <div class="welcome-box">
    <div class="welcome-logo">📝</div>
    <div class="welcome-title">اختبار <span>علم النفس</span></div>
    <div class="welcome-sub">50 سؤال — اختيار متعدد وصح وخطأ</div>

    <!-- reward notice -->
    <div style="background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.4);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:0.85rem;color:#d4af37;text-align:right;line-height:1.7">
      🎁 <strong>مكافأة خاصة</strong> لمن يحصل على <strong>45 من 50</strong> أو أكثر!<br>
      <span style="color:#a0a0c0;font-size:0.8rem">اجتهد واكتشف المكافأة بنفسك 👀</span>
    </div>

    <!-- no-edit notice -->
    <div style="background:rgba(231,76,60,0.08);border:1px solid rgba(231,76,60,0.3);border-radius:12px;padding:10px 16px;margin-bottom:20px;font-size:0.82rem;color:#e74c3c;text-align:right;line-height:1.6">
      ⚠️ <strong>تنبيه:</strong> لا يوجد أي تعديل على الأسئلة بعد بدء الاختبار
    </div>

    <label class="welcome-label">اسمك الكامل</label>
    <input class="welcome-input" id="name-input" type="text" placeholder="الاسم الكامل..." maxlength="40">

    <label class="welcome-label">جروبك</label>
    <input class="welcome-input" id="group-input" type="text" placeholder="مثال: A — B — C ..." maxlength="20" style="margin-bottom:8px">

    <div class="welcome-err" id="name-err">⚠️ من فضلك اكتب اسمك وجروبك</div>
    <button class="start-btn" onclick="startQuiz()">ابدأ الاختبار ←</button>
  </div>
</div>

  const inp = document.getElementById('name-input');

  const err = document.getElementById('name-err');
  userName = inp.value.trim();
  userGroup = grp.value.trim();
  if(!userName || !userGroup){err.style.display='block';return;}
  err.style.display='none';

  document.getElementById('user-greeting').innerHTML = `أهلاً <span>${userName}</span> — جروب <span>${userGroup}</span> 🎯`;

}

  {type:'tf',q:"التجارب الميدانية يتم فيها وضع أفراد العينة في مناخ تجريبي أو اصطناعي يتناسب مع أغراض البحث",a:false},
  {type:'tf',q:"الدوافع الاجتماعية هي دوافع أولية يولد الفرد بها",a:false},
  {type:'tf',q:"يتمثل قانون المصير المشترك في ميل الإنسان وفطرته لتنظيم المدركات في شكل وخلفية",a:false},
  {type:'tf',q:"الحاجات الجمالية هي الحاجة إلى النظام والتماثل وإتمام الفعل وتتمثل في تحقيق التوازن الانفعالي وعدم وجود اضطراب أو فوضى",a:true},
  {type:'tf',q:"في قانون الإغلاق الإدراكي الأشياء الكاملة عادة تنقص وتترك كلها ناقصة",a:false},
  {type:'tf',q:"السلوك الظاهر يمثل حكم الشخص على مشاعره وشدتها ونوعيتها",a:false},
  {type:'tf',q:"الباعث هو موضوع أو شخص ندركه على أنه قادر على إشباع حاجة الفرد",a:true},
  {type:'tf',q:"الاستجابة هي رد الفعل السابق للمنبه",a:false},
  {type:'tf',q:"في قانون التقارب الإدراكي تتقارب التنبيهات الحسية في المكان أو الزمان كما تبدو في مجال إدراكنا وحدة مستقلة محددة",a:true},
  {type:'tf',q:"من خطوات المنهج الوصفي جمع البيانات والمعلومات من المصادر المختلفة",a:true},
  {type:'tf',q:"المتغير التابع هو العامل الذي يريد الباحث قياس مدى تأثيره في الظاهرة المدروسة",a:true},
  {type:'tf',q:"المنهج المقارن هو الذي يبرز أوجه الشبه والاختلاف فيما بين ظاهرتين أو أكثر",a:true},
  {type:'tf',q:"إذا تعاونت أنظمة الشخصية يسرت لصاحبها التفاعل مع البيئة على نحو مرضٍ",a:true},
  {type:'tf',q:"يعد تقدير الذات متغيراً مستقلاً في عنوان البحث التالي: (تقدير الذات وعلاقته بالسلوك العدواني)",a:true},
];

let userAnswers=new Array(questions.length).fill(null);
let current=0,finished=false;

function render(){
  const app=document.getElementById('app');
  if(finished){app.innerHTML=renderResults();return;}
  app.innerHTML=renderQuiz();
}

function renderQuiz(){
  const q=questions[current];
  const answered=userAnswers[current]!==null;
  const pct=Math.round((current/questions.length)*100);
  const isMcq=q.type==='mcq';

  let answersHtml='';
  if(isMcq){
    answersHtml='<div class="answers">';
    q.opts.forEach((opt,j)=>{
      let cls='ans-btn';
      if(answered){
        if(j===userAnswers[current]) cls+=j===q.a?' selected-correct':' selected-wrong';
        else if(j===q.a) cls+=' reveal-correct';
      }
      answersHtml+=`<button class="${cls}" onclick="answer(${j})" ${answered?'disabled':''}>${opt}</button>`;
    });
    answersHtml+='</div>';
  } else {
    const tCls=answered?(userAnswers[current]===true?(q.a===true?'selected-correct':'selected-wrong'):(q.a===true?'reveal-correct':'')):'';
    const fCls=answered?(userAnswers[current]===false?(q.a===false?'selected-correct':'selected-wrong'):(q.a===false?'reveal-correct':'')):'';
    answersHtml=`<div class="tf-answers">
      <button class="tf-btn ${tCls}" onclick="answer(true)" ${answered?'disabled':''}>✔ صح</button>
      <button class="tf-btn ${fCls}" onclick="answer(false)" ${answered?'disabled':''}>✘ خطأ</button>
    </div>`;
  }

  let feedbackHtml='<div class="feedback"></div>';
  if(answered){
    const ok=isMcq?userAnswers[current]===q.a:userAnswers[current]===q.a;
    feedbackHtml=`<div class="feedback ${ok?'correct':'wrong'}">${ok?'✅ إجابة صحيحة!':'❌ إجابة خاطئة!'}</div>`;
  }

  const dots=questions.map((_,i)=>{
    let cls='dot';
    if(i===current) cls+=' current';
    else if(userAnswers[i]!==null){
      const q2=questions[i];
      cls+=(q2.type==='mcq'?userAnswers[i]===q2.a:userAnswers[i]===q2.a)?' answered-correct':' answered-wrong';
    }
    return `<div class="${cls}" onclick="goTo(${i})">${i+1}</div>`;
  }).join('');

  const isLast=current===questions.length-1;
  const nextBtn=isLast
    ?`<button class="nav-btn finish" onclick="finish()">إنهاء الاختبار 🏁</button>`
    :`<button class="nav-btn next" onclick="next()">التالي ←</button>`;

  return `
    <div class="progress-wrap">
      <div class="progress-info"><span>السؤال ${current+1} من ${questions.length}</span><span>${pct}%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="question-card">
      <div class="q-number">سؤال رقم ${current+1}</div>
      <span class="q-type-badge ${isMcq?'badge-mcq':'badge-tf'}">${isMcq?'اختيار متعدد':'صح أم خطأ'}</span>
      <div class="q-text">${q.q}</div>
      ${answersHtml}
      ${feedbackHtml}
      <div class="nav-buttons">
        <button class="nav-btn prev" onclick="prev()" ${current===0?'disabled style="opacity:0.3"':''}>→ السابق</button>
        ${nextBtn}
      </div>
    </div>
    <div class="dots-wrap">${dots}</div>`;
}

function renderResults(){
  const correctCount=userAnswers.filter((a,i)=>a===questions[i].a).length;
  const wrong=questions.length-correctCount;
  const pct=Math.round((correctCount/questions.length)*100);
  const grade=pct>=90?'🏆 ممتاز':pct>=75?'✨ جيد جداً':pct>=60?'👍 جيد':pct>=50?'⚠️ مقبول':'❌ راجع المادة';

  const isWinner=correctCount>=45;
  const winnerHtml=isWinner?`
    <div class="winner-frame">
      <div class="confetti-row">🎊 🌟 🎊 🌟 🎊</div>
      <div class="winner-crown">👑</div>
      <div class="winner-name">${userName}</div>
      <div class="winner-msg">حصلت على ${correctCount} من 50 — إنجاز رائع! أنت من المتميزين 🌟</div>
    </div>` : '';

  const wrongItems=questions.map((q,i)=>{
    if(userAnswers[i]===null||userAnswers[i]===q.a) return '';
    const cLabel=q.type==='mcq'?q.opts[q.a]:(q.a?'صح':'خطأ');
    const yLabel=q.type==='mcq'?q.opts[userAnswers[i]]:(userAnswers[i]?'صح':'خطأ');
    return `<div class="wrong-item">
      <div class="q-num-lbl">سؤال ${i+1}</div>
      <div class="q-txt">${q.q}</div>
      <div class="correct-ans">✅ الإجابة الصحيحة: ${cLabel}</div>
      <div class="your-ans">❌ إجابتك: ${yLabel}</div>
    </div>`;
  }).join('');

  const unanswered=userAnswers.filter(a=>a===null).length;

  const noEditNotice=`<div style="background:rgba(231,76,60,0.08);border:1px solid rgba(231,76,60,0.25);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:0.82rem;color:#e74c3c;text-align:center">
    ⚠️ لا يوجد أي تعديل على الأسئلة — النتيجة نهائية
  </div>`;

  return `<div class="results">
    <div class="result-title">نتيجة ${userName}</div>
    <div style="font-size:0.85rem;color:var(--accent);margin-bottom:6px;font-weight:700">جروب ${userGroup}</div>
    <div class="result-score"><span>${correctCount}</span> / ${questions.length}</div>
    <div class="result-grade">${grade} — ${pct}%</div>
    <div class="result-breakdown">
      <div class="rb c"><div class="rb-num">${correctCount}</div><div class="rb-lbl">صحيحة</div></div>
      <div class="rb w"><div class="rb-num">${wrong}</div><div class="rb-lbl">خاطئة</div></div>
    </div>
    ${noEditNotice}
    ${winnerHtml}
    ${unanswered>0?`<p style="color:#666;font-size:0.88rem;margin-bottom:16px;">⚠️ ${unanswered} سؤال لم تجب عليه</p>`:''}
    ${wrongItems?`<div class="wrong-list"><div class="wrong-title">📋 الأسئلة التي أخطأت فيها:</div>${wrongItems}</div>`:'<p style="color:var(--correct);font-size:1.05rem;margin-bottom:20px;">🎉 أجبت على كل الأسئلة بشكل صحيح!</p>'}
    <button class="retry-btn" onclick="retry()">🔄 إعادة الاختبار</button>
  </div>`;
}

function answer(val){if(userAnswers[current]!==null)return;userAnswers[current]=val;render();}
function next(){if(current<questions.length-1){current++;render();}}
function prev(){if(current>0){current--;render();}}
function goTo(i){current=i;render();}
function finish(){finished=true;render();}
function retry(){userAnswers=new Array(questions.length).fill(null);current=0;finished=false;render();}
</script>
</body>
</html>
